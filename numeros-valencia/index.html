<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Comptem en valencià</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: toy-box. A night-blue play mat; every control is a chunky 3D toy block; base-ten blocks (blue rods = desenes, red cubes = unitats) are the star.
   Single committed theme (vivid, same in light and dark hosts). */
:root{
  --mat1:#3a2fd8; --mat2:#1a1468; --mat3:#100c47;
  --paper:#ffffff; --ink:#1c1850; --ink2:#5b5890; --line:#e3e1fb;
  --rod:#3d6bff; --cube:#ff4566; --sun:#ffc93c; --mint:#17c3a1; --grape:#a55cff; --tang:#ff8a1f;
  --rod-l:#9db6ff; --cube-l:#ff9cad; --mint-l:#7af0d6;
  --ok:#12a37f; --bad:#e8344f;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--mat3)}
body{
  min-height:100vh;color:#fff;font-family:var(--body);font-size:18px;line-height:1.45;
  background:
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.09) 1.5px,transparent 0) 0 0/26px 26px,
    radial-gradient(1200px 600px at 85% -10%,#5a4cff 0,transparent 60%),
    radial-gradient(900px 500px at -10% 110%,#2a1f9e 0,transparent 60%),
    linear-gradient(180deg,var(--mat1),var(--mat2) 55%,var(--mat3));
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.app{max-width:980px;margin:0 auto;padding-block:14px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:26px}

#view{display:flex;flex-direction:column;gap:34px}
.playhead+.q{margin-top:-8px}
/* toy block button */
.blk{--c:var(--rod);--cd:color-mix(in srgb,var(--c) 62%,#000);
  background:var(--c);border:0;border-radius:18px;color:#fff;
  box-shadow:0 7px 0 var(--cd),0 14px 26px rgba(8,4,50,.45),inset 0 2px 0 rgba(255,255,255,.35);
  transition:transform .08s,box-shadow .08s}
.blk:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd),0 6px 12px rgba(8,4,50,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.blk.dark-text{color:var(--ink)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--display);font-size:1.35rem;letter-spacing:.01em}
.logo{display:flex;align-items:flex-end;gap:3px;height:34px}
.logo i{display:block;width:9px;border-radius:3px;background:var(--rod);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.logo i:nth-child(1){height:34px}.logo i:nth-child(2){height:34px}.logo b{display:block;width:9px;height:9px;border-radius:2px;background:var(--cube)}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.15rem;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 14px 3px 9px;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.pill .star{fill:var(--sun)} .pill .fire{fill:var(--tang)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,7vw,4.4rem);line-height:.98;margin:0;text-wrap:balance;
  text-shadow:0 5px 0 var(--mat3),0 10px 30px rgba(0,0,0,.35)}
.hero p{margin:12px 0 0;color:#d9d6ff;max-width:44ch;font-size:1.08rem}
.showcase{position:relative;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);border-radius:28px;padding:20px 16px 18px;
  display:flex;flex-direction:column;align-items:center;gap:12px;min-height:300px;justify-content:flex-end;cursor:pointer;text-align:center;color:#fff;font:inherit}
.showcase .big{font-family:var(--display);font-size:clamp(3.6rem,12vw,5.4rem);line-height:.9;color:var(--sun);text-shadow:0 6px 0 #a5700a}
.showcase .w{font-family:var(--display);font-size:clamp(1.5rem,5vw,2.1rem);line-height:1;min-height:1.1em}
.showcase .d{color:var(--rod-l)} .showcase .u{color:var(--cube-l)} .showcase .t{color:var(--mint-l)}
.showcase small{color:#bdb9f5;font-weight:700}

/* base-ten blocks */
.bt{--s:16px;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:calc(var(--s)*.4);max-width:100%}
.rods{display:flex;gap:calc(var(--s)*.3);align-items:flex-end}
.rod{display:grid;grid-template-rows:repeat(10,1fr);gap:2px;width:var(--s);height:calc(var(--s)*10 + 18px)}
.rod i,.cube{display:block;border-radius:3px;background:var(--rod);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.4)}
.cubes{display:grid;grid-template-columns:repeat(3,var(--s));gap:3px;align-content:end}
.cube{width:var(--s);height:var(--s);background:var(--cube)}
.anim .rod,.anim .cube{animation:drop .45s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*55ms)}
@keyframes drop{from{transform:translateY(-40px) scale(.6);opacity:0}}

/* ranges */
.sect h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0 0 12px}
.ranges{display:flex;flex-wrap:wrap;gap:12px}
.chip{--c:#4b41e0;font-family:var(--display);font-size:1.2rem;padding:8px 16px;border-radius:14px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{--c:var(--sun);color:var(--ink)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px 16px}
.mode{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;min-height:196px}
.mode .pv{flex:1;display:grid;place-items:center;font-family:var(--display);font-size:clamp(1.5rem,4.2vw,2rem);line-height:1;padding:18px 12px 10px;
  text-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap}
.mode .meta{background:rgba(0,0,0,.16);padding:10px 14px 12px;display:flex;flex-direction:column;gap:2px}
.mode h3{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;line-height:1.1}
.mode p{margin:0;font-size:.92rem;line-height:1.3;opacity:.92}
.mode.dark-text .meta{background:rgba(255,255,255,.35)}
.best{display:flex;gap:2px;margin-top:4px}
.best svg{width:17px;height:17px;fill:rgba(255,255,255,.35)} .best svg.on{fill:#fff3b8}
.dark-text .best svg{fill:rgba(28,24,80,.22)} .dark-text .best svg.on{fill:var(--ink)}
.mini-bt{--s:9px}

/* play */
.playhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{--c:#4b41e0;font-family:var(--display);font-size:1.05rem;padding:7px 16px;border-radius:14px}
.playhead h2{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,4vw,1.9rem);margin:0;flex:1;min-width:0}
.prog{display:flex;gap:6px;width:100%}
.prog i{flex:1;height:14px;border-radius:5px;background:rgba(255,255,255,.15);transition:background .2s}
.prog i.ok{background:var(--mint)} .prog i.bad{background:var(--cube)} .prog i.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}

.q{position:relative;background:var(--paper);color:var(--ink);border-radius:28px;padding:30px 18px 26px;
  display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;min-height:300px;justify-content:center;
  box-shadow:0 10px 0 #c9c4f7,0 26px 50px rgba(5,2,40,.5)}
.q.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-1deg)}60%{transform:translateX(10px) rotate(1deg)}}
.q.win{animation:win .5s}
@keyframes win{40%{transform:scale(1.03)}}
.ask{margin:0;font-weight:800;color:var(--ink2);font-size:1.1rem}
.word{font-family:var(--display);font-size:clamp(2.2rem,9vw,3.8rem);line-height:1.02;word-break:break-word}
.bignum{font-family:var(--display);font-size:clamp(4rem,16vw,6.5rem);line-height:.9;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 6px 0 var(--line)}
.d{color:var(--rod)} .u{color:var(--cube)} .t{color:#0c9e82}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-family:var(--display);font-size:clamp(1.7rem,6.5vw,2.6rem)}
input.num,input.txt{font-family:var(--display);font-size:clamp(1.7rem,6.5vw,2.5rem);text-align:center;color:var(--ink);
  background:#f2f1ff;border:3px solid var(--line);border-bottom-width:7px;border-radius:16px;padding:4px 6px;width:3.4ch;min-width:2.6em;transition:border-color .15s}
input.num:focus,input.txt:focus{outline:none;border-color:var(--grape)}
input.txt{width:100%;max-width:440px;font-size:clamp(1.5rem,5.5vw,2.1rem)}
input.dd{border-color:#c9d6ff;border-bottom-color:var(--rod)} input.uu{border-color:#ffd0d8;border-bottom-color:var(--cube)}
input:disabled{opacity:1;background:#f7f7fb}
.unit{font-size:.75em}
.speak{--c:var(--grape);display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;font-weight:800}
.speak svg{width:20px;height:20px;fill:currentColor}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 12px;width:100%;max-width:600px}
.opt{--c:#efeefe;--cd:#cfcbf6;color:var(--ink);padding:14px 10px;font-family:var(--display);font-size:1.45rem}
.opt[aria-pressed="true"]{--c:var(--grape);--cd:#6b2fc0;color:#fff}
.opt.right{--c:var(--mint);--cd:#0b8a71;color:#fff}
.opt.wrong{--c:var(--cube);--cd:#b81e3a;color:#fff}

.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;width:100%}
.expr{font-family:var(--display);font-size:clamp(1.3rem,5vw,2rem);background:#f2f1ff;border-radius:18px;padding:16px 8px;min-width:0;word-break:break-word}
.slot{display:grid;place-items:center;width:70px;height:70px;border-radius:18px;border:4px dashed var(--line);font-family:var(--display);font-size:2.4rem;color:var(--grape)}
.signs{display:flex;gap:14px}
.sign{--c:#efeefe;--cd:#cfcbf6;color:var(--ink);width:76px;height:66px;font-family:var(--display);font-size:2.2rem}
.sign[aria-pressed="true"]{--c:var(--grape);--cd:#6b2fc0;color:#fff}

.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;min-height:72px}
.tile{--c:var(--sun);--cd:#c28e0a;color:var(--ink);width:70px;height:64px;font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums;border-radius:16px}
.tile.used{visibility:hidden}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;min-height:86px;width:100%;padding:10px;border-radius:20px;background:#f2f1ff;border:3px dashed var(--line)}
.tray .tile{--c:var(--grape);--cd:#6b2fc0;color:#fff}
.tray:empty::before{content:"Toca els nombres en ordre";color:var(--ink2);font-weight:800;align-self:center}
.dir{font-family:var(--display);font-size:1.6rem;display:flex;align-items:center;gap:10px}
.stairs{display:flex;align-items:flex-end;gap:3px;height:30px}
.stairs i{width:8px;border-radius:2px;background:var(--grape)}

.fb{border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:var(--ink);background:#fff;border-left:12px solid}
.fb strong{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1}
.fb.ok{border-color:var(--mint)} .fb.ok strong{color:var(--ok)}
.fb.bad{border-color:var(--cube)} .fb.bad strong{color:var(--bad)}
.fb.hint{border-color:var(--sun)}
.fb .bt{--s:11px;margin-top:4px}
.actions{display:flex;justify-content:flex-end}
.go{--c:var(--mint);--cd:#0b8a71;font-family:var(--display);font-size:1.6rem;padding:12px 34px;border-radius:20px}

/* learn */
.grid100{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;width:100%}
.cell{--c:#efeefe;--cd:#d3cff7;color:var(--ink);aspect-ratio:1;max-width:100%;border-radius:10px;padding:0;font-family:var(--display);font-size:clamp(.85rem,2.8vw,1.25rem);font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--cd)}
.cell:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cd)}
.cell[aria-pressed="true"]{--c:var(--sun);--cd:#c28e0a}
.detail{display:flex;flex-direction:column;align-items:center;gap:10px}
.du{color:var(--ink2);font-weight:800;font-size:1.05rem}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:.95rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:14px;height:14px;border-radius:3px}

.done{gap:16px}
.bigstars{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.bigstars svg{width:70px;height:70px;fill:#e5e3fb}
.bigstars svg:nth-child(2){width:96px;height:96px}
.bigstars svg.on{fill:var(--sun);filter:drop-shadow(0 5px 0 #c28e0a);animation:pop .5s cubic-bezier(.3,1.7,.5,1) backwards}
.bigstars svg:nth-child(2).on{animation-delay:.2s}.bigstars svg:nth-child(3).on{animation-delay:.4s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.done h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,6vw,2.6rem);margin:0;line-height:1.05;text-wrap:balance}
.doneacts{display:flex;gap:14px 12px;flex-wrap:wrap;justify-content:center}
.ghost{--c:#efeefe;--cd:#cfcbf6;color:var(--ink);font-family:var(--display);font-size:1.3rem;padding:12px 22px;border-radius:20px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (max-width:700px){.hero{grid-template-columns:1fr}.showcase{min-height:260px}}
@media (max-width:440px){.cmp{grid-template-columns:1fr}.cmp .slot{justify-self:center}.modes{grid-template-columns:1fr 1fr;gap:16px 12px}.mode{min-height:170px}.mode p{display:none}.pill span.lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Tornar a l’inici"><span class="logo" aria-hidden="true"><i></i><i></i><b></b></span>Comptem</button>
    <div class="pills">
      <div class="pill" id="streakPill" title="Encerts seguits" hidden><svg class="fire" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5s.7 3-1.6 5.6C9.6 9.7 7 11.4 7 15a5 5 0 0 0 10 0c0-1.6-.6-3-1.4-4 .1 1.6-.6 2.8-1.7 3.1.6-2.6-.3-5.7-2.4-7.6 2.3-.3 3.6-2.6 2-5zM12 22a7 7 0 0 1-7-7c0-2.3 1-4 2.2-5.5C6.4 12 7 13.5 8 14.3 8 10 11 8 12.6 5.6 15 8 19 11 19 15a7 7 0 0 1-7 7z"/></svg><span id="streak">0</span></div>
      <div class="pill" title="Estrelles guanyades"><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg><span id="totalStars">0</span></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
(() => {
/* ---------- Nombres en valencià ---------- */
const UNI=['zero','un','dos','tres','quatre','cinc','sis','set','huit','nou'];
const TEEN=['deu','onze','dotze','tretze','catorze','quinze','setze','dèsset','devuit','dènou'];
const TENS={2:'vint',3:'trenta',4:'quaranta',5:'cinquanta',6:'seixanta',7:'setanta',8:'huitanta',9:'noranta'};
function parts(n){
  if(n===100) return {whole:'cent'};
  if(n<10) return {whole:n===1?'u':UNI[n]};
  if(n<20) return {whole:TEEN[n-10]};
  const t=Math.floor(n/10),u=n%10;
  if(!u) return {d:TENS[t],j:'',u:''};
  return {d:TENS[t],j:t===2?'-i-':'-',u:UNI[u]};
}
function nom(n){const p=parts(n);return p.whole??(p.d+p.j+p.u);}
function nomHTML(n){const p=parts(n);if(p.whole) return `<span class="t">${p.whole}</span>`;return `<span class="d">${p.d}</span>${p.j}${p.u?`<span class="u">${p.u}</span>`:''}`;}
const ALT_U={1:['un','u'],8:['huit','vuit']};
const ALT_TEEN={17:['dèsset','disset','desset','dèset'],18:['devuit','divuit','dihuit','díhuit'],19:['dènou','dinou','denou']};
const ALT_T={8:['huitanta','vuitanta']};
function variants(n){
  if(n===100) return ['cent'];
  if(n<20&&n>=10) return ALT_TEEN[n]||[TEEN[n-10]];
  const t=Math.floor(n/10),u=n%10,ts=ALT_T[t]||[TENS[t]];
  if(!u) return ts;
  const us=ALT_U[u]||[UNI[u]],out=[];
  ts.forEach(a=>us.forEach(b=>out.push(a+(t===2?'-i-':'-')+b)));
  return out;
}
const clean=s=>s.toLowerCase().trim().replace(/[’']/g,'').replace(/[\s-]+/g,'-');
const bare=s=>clean(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/-/g,'');
function checkName(input,n){const v=variants(n),c=clean(input);if(v.includes(c)) return 'ok';if(v.some(x=>bare(x)===bare(c))) return 'near';return 'bad';}

/* ---------- utilitats ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>';
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const stars=(k,cls='')=>[1,2,3].map(i=>STAR.replace('<svg',`<svg class="${i<=k?'on':''}"`)).join('');
const store={get(k,d){try{const v=localStorage.getItem('cv_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('cv_'+k,JSON.stringify(v));}catch(e){}}};
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text);u.lang='ca-ES';u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/^ca/i.test(v.lang));if(v) u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
const speakBtn=n=>`<button type="button" class="blk speak" data-say="${nom(n)}">${SPK} Escolta</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say);}});

// blocs multibase: barres (desenes) i cubets (unitats)
function blocks(n,cls=''){
  const t=Math.floor(n/10),u=n%10;let k=0;
  const rods=Array.from({length:t},()=>`<span class="rod" style="--i:${k++}">${'<i></i>'.repeat(10)}</span>`).join('');
  const cubes=Array.from({length:u},()=>`<span class="cube" style="--i:${k++}"></span>`).join('');
  return `<div class="bt ${cls}" aria-label="${t} desenes i ${u} unitats">${t?`<div class="rods">${rods}</div>`:''}${u?`<div class="cubes">${cubes}</div>`:''}</div>`;
}

/* ---------- confeti ---------- */
const fx=$('#fx'),ctx=fx.getContext('2d');let parts_=[],raf=0;
function confetti(amount=70){
  if(reduced()) return;
  const dpr=devicePixelRatio||1;fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#3d6bff','#ff4566','#ffc93c','#17c3a1','#a55cff','#ff8a1f'];
  for(let i=0;i<amount;i++) parts_.push({x:innerWidth/2+rnd(-60,60),y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-5,
    s:rnd(7,13),r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],sq:Math.random()<.5,life:0});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts_=parts_.filter(p=>p.life<140&&p.y<innerHeight+40);
  for(const p of parts_){p.life++;p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    if(p.sq) ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);else{ctx.beginPath();ctx.arc(0,0,p.s/2.4,0,7);ctx.fill();}
    ctx.restore();}
  raf=parts_.length?requestAnimationFrame(tick):0;
}

/* ---------- configuració ---------- */
const RANGES=[
  {id:'10-19',min:10,max:19},{id:'20-29',min:20,max:29},{id:'10-29',min:10,max:29},
  {id:'30-59',min:30,max:59},{id:'60-100',min:60,max:100},{id:'10-100',min:10,max:100}];
const MODES=[
  {id:'learn',t:'Aprén els nombres',p:'Toca un nombre i mira com es fa amb blocs.',c:'var(--mint)',pv:'blocks'},
  {id:'lx',t:'De lletres a xifres',p:'Llig el nom i escriu la xifra.',c:'var(--rod)',pv:'tretze → 13'},
  {id:'tria',t:'Tria el nom',p:'Quin és el nom correcte?',c:'var(--grape)',pv:'17 = ?'},
  {id:'xl',t:'Escriu amb lletres',p:'Escriu el nom en valencià.',c:'var(--cube)',pv:'14 → catorze'},
  {id:'ap',t:'Anterior i posterior',p:'El nombre d’abans i el de després.',c:'var(--sun)',pv:'_ < 13 < _',dark:1},
  {id:'dec',t:'Descomposició',p:'Desenes (D) i unitats (U).',c:'var(--tang)',pv:'16 = 1D + 6U'},
  {id:'ord',t:'Ordena els nombres',p:'De menor a major o al revés.',c:'#2bb3f3',pv:'11 · 12 · 13'},
  {id:'cmp',t:'Compara',p:'Posa >, < o = entre dos nombres.',c:'#ff5fb0',pv:'23 > 19'},
  {id:'sum',t:'Sumes',p:'Suma desenes i unitats.',c:'#7bcf2e',pv:'20 + 7',dark:1},
  {id:'mix',t:'Repàs de tot',p:'Un poc de cada exercici.',c:'#ffffff',pv:'? ? ?',dark:1}];
const ROUND=10;
let R=RANGES.find(r=>r.id===store.get('range','10-100'))||RANGES[5];
const pickN=(lo=R.min,hi=R.max)=>rnd(Math.max(lo,R.min),Math.min(hi,R.max));
const bestKey=m=>`best_${m}_${R.id}`;
const updateTotal=()=>{$('#totalStars').textContent=store.get('total',0);};
let heroTimer=0;

/* ---------- inici ---------- */
function home(){
  clearInterval(heroTimer);$('#streakPill').hidden=true;
  $('#view').innerHTML=`
  <section class="hero">
    <div>
      <h1>Comptem en valencià del 10 al 100</h1>
      <p>Llig, escriu, ordena i descompon nombres com a la fitxa de classe. Cada barra blava són 10 unitats i cada cubet roig és 1.</p>
    </div>
    <button class="showcase" id="show" aria-label="Canvia el nombre de mostra">
      <div id="showBt"></div><div class="big" id="showN"></div><div class="w" id="showW"></div><small>Toca per a canviar de nombre</small>
    </button>
  </section>
  <section class="sect">
    <h2>Amb quins nombres vols jugar?</h2>
    <div class="ranges">${RANGES.map(r=>`<button class="blk chip" data-range="${r.id}" aria-pressed="${r.id===R.id}">${r.id.replace('-','–')}</button>`).join('')}</div>
  </section>
  <section class="sect">
    <h2>Tria un joc</h2>
    <div class="modes">${MODES.map(m=>{
      const b=store.get(bestKey(m.id),0);
      return `<button class="blk mode ${m.dark?'dark-text':''}" data-mode="${m.id}" style="--c:${m.c}">
        <span class="pv" aria-hidden="true">${m.pv==='blocks'?blocks(23,'mini-bt'):m.pv}</span>
        <span class="meta"><h3>${m.t}</h3><p>${m.p}</p>
        ${m.id==='learn'?'':`<span class="best" aria-label="Millor resultat: ${b} de 3 estrelles">${stars(b)}</span>`}</span>
      </button>`;}).join('')}</div>
  </section>`;
  $('#view').querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{R=RANGES.find(r=>r.id===b.dataset.range);store.set('range',R.id);home();});
  $('#view').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>b.dataset.mode==='learn'?learn():start(b.dataset.mode));
  let cur=0;
  const showNum=()=>{let n;do{n=pickN();}while(n===cur&&R.max>R.min);cur=n;
    $('#showBt').innerHTML=blocks(n,'anim');$('#showN').textContent=n;$('#showW').innerHTML=nomHTML(n);};
  $('#show').onclick=()=>{showNum();speak(nom(cur));clearInterval(heroTimer);heroTimer=setInterval(showNum,4000);};
  showNum();heroTimer=setInterval(showNum,4000);
}

/* ---------- aprén ---------- */
function learn(){
  clearInterval(heroTimer);
  const m=MODES[0];
  $('#view').innerHTML=`
  <div class="playhead"><button class="blk back" id="back">Tornar</button><h2>${m.t}: ${R.id.replace('-','–')}</h2></div>
  <div class="q"><div class="detail" id="det"></div>
    <div class="legend"><span><b style="background:var(--rod)"></b>desenes</span><span><b style="background:var(--cube)"></b>unitats</span><span><b style="background:#0c9e82"></b>nom especial</span></div>
    <div class="grid100" id="g"></div></div>`;
  $('#back').onclick=home;
  const g=$('#g');
  for(let n=R.min;n<=R.max;n++) g.insertAdjacentHTML('beforeend',`<button class="blk cell" data-n="${n}" aria-pressed="false">${n}</button>`);
  const show=n=>{
    g.querySelectorAll('.cell').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.n===n));
    const t=Math.floor(n/10),u=n%10;
    $('#det').innerHTML=`${blocks(n,'anim')}<div class="bignum"><span class="d">${n===100?'10':t}</span><span class="u">${n===100?'0':u}</span></div>
      <div class="word">${nomHTML(n)}</div>
      <div class="du">${n===100?'10 desenes = 100':`${t} ${t===1?'desena':'desenes'} i ${u} ${u===1?'unitat':'unitats'} = ${t*10} + ${u}`}</div>${speakBtn(n)}`;
  };
  g.onclick=e=>{const c=e.target.closest('.cell');if(c){show(+c.dataset.n);speak(nom(+c.dataset.n));}};
  show(R.min);
}

/* ---------- generadors ---------- */
const val=id=>($('#'+id)?.value||'').trim();
const numIn=(id,label,cls='')=>`<input id="${id}" class="num ${cls}" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="${label}">`;
const G={};
G.lx=q=>{
  const n=pickN();
  q.innerHTML=`<p class="ask">Escriu la xifra</p><div class="word">${nom(n)}</div>${speakBtn(n)}${numIn('a1','Xifra')}`;
  return ()=>{const v=val('a1');if(!v) return {empty:1};return {res:+v===n?'ok':'bad',ans:`${nomHTML(n)} = <b>${n}</b>`,n};};
};
G.tria=q=>{
  const n=pickN();
  const cand=[n-1,n+1,n-10,n+10,n+2,n-2,(n%10)*10+Math.floor(n/10),n+11,n-11].filter(x=>x>=10&&x<=100&&x!==n);
  const opts=shuffle([n,...shuffle([...new Set(cand)]).slice(0,3)]);
  q.innerHTML=`<p class="ask">Quin és el nom d’aquest nombre?</p><div class="bignum">${n}</div>
    <div class="opts">${opts.map(o=>`<button class="blk opt" data-v="${o}" aria-pressed="false">${nom(o)}</button>`).join('')}</div>`;
  let pick=null;
  q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(q.dataset.locked) return;pick=+b.dataset.v;q.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));});
  return ()=>{
    if(pick===null) return {empty:1,msg:'Toca una de les respostes.'};
    q.querySelectorAll('.opt').forEach(o=>{o.setAttribute('aria-pressed','false');if(+o.dataset.v===n)o.classList.add('right');else if(+o.dataset.v===pick)o.classList.add('wrong');});
    return {res:pick===n?'ok':'bad',ans:`<b>${n}</b> es diu ${nomHTML(n)}`,n};
  };
};
G.xl=q=>{
  const n=pickN();
  q.innerHTML=`<p class="ask">Escriu el nom en valencià</p><div class="bignum">${n}</div>
    <input id="a1" class="txt" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Nom del nombre">`;
  return ()=>{const v=val('a1');if(!v) return {empty:1};const r=checkName(v,n);
    return {res:r,ans:`<b>${n}</b> s’escriu ${nomHTML(n)}`,tip:r==='near'?`Fixa’t en els accents i els guionets.`:'',n};};
};
G.ap=q=>{
  const n=pickN(1,99);
  q.innerHTML=`<p class="ask">Escriu el nombre anterior i el posterior</p>
    <div class="row">${numIn('a1','Anterior')}<span>&lt;</span><span class="bignum" style="font-size:1.5em">${n}</span><span>&lt;</span>${numIn('a2','Posterior')}</div>`;
  return ()=>{const a=val('a1'),b=val('a2');if(!a||!b) return {empty:1};
    return {res:(+a===n-1&&+b===n+1)?'ok':'bad',ans:`<b>${n-1}</b> &lt; ${n} &lt; <b>${n+1}</b>`};};
};
G.dec=q=>{
  const n=pickN(10,99),t=Math.floor(n/10),u=n%10;
  q.innerHTML=`<p class="ask">Descompon en desenes (D) i unitats (U)</p>
    <div class="row"><span class="bignum" style="font-size:1.4em">${n}</span><span>=</span>${numIn('a1','Desenes','dd')}<span class="unit d">D</span><span>+</span>${numIn('a2','Unitats','uu')}<span class="unit u">U</span></div>
    <div class="row"><span>=</span>${numIn('a3','Valor de les desenes','dd')}<span>+</span>${numIn('a4','Valor de les unitats','uu')}</div>`;
  return ()=>{
    const a=[val('a1'),val('a2'),val('a3'),val('a4')];if(a.some(x=>!x)) return {empty:1};
    const ok1=+a[0]===t&&+a[1]===u,ok2=+a[2]===t*10&&+a[3]===u;
    let tip='';if(ok1&&!ok2&&+a[2]===t) tip=`Recorda: ${t} ${t===1?'desena val':'desenes valen'} <b>${t*10}</b>, no ${t}.`;
    return {res:ok1&&ok2?'ok':'bad',ans:`${n} = <span class="d">${t} D</span> + <span class="u">${u} U</span> = <span class="d">${t*10}</span> + <span class="u">${u}</span>`,tip,n};
  };
};
G.ord=q=>{
  const size=R.max-R.min+1,k=Math.min(6,size),set=new Set();
  while(set.size<k) set.add(rnd(R.min,R.max));
  const nums=shuffle([...set]),up=Math.random()<.5,placed=[];
  const sorted=[...nums].sort((a,b)=>up?a-b:b-a);
  const st=[1,2,3,4].map(h=>`<i style="height:${(up?h:5-h)*7}px"></i>`).join('');
  q.innerHTML=`<p class="ask">Ordena de</p><div class="dir"><span class="stairs" aria-hidden="true">${st}</span>${up?'menor a major':'major a menor'}</div>
    <div class="tiles" id="src">${nums.map((n,i)=>`<button class="blk tile" data-i="${i}">${n}</button>`).join('')}</div>
    <div class="tray" id="tray" aria-label="La teua ordenació"></div><p class="ask" style="font-size:.9rem">Toca un nombre de la safata per a llevar-lo.</p>`;
  const draw=()=>{
    q.querySelectorAll('#src .tile').forEach(b=>b.classList.toggle('used',placed.includes(+b.dataset.i)));
    $('#tray').innerHTML=placed.map(i=>`<button class="blk tile" data-i="${i}">${nums[i]}</button>`).join('');
  };
  $('#src').onclick=e=>{const b=e.target.closest('.tile');if(!b||q.dataset.locked||placed.includes(+b.dataset.i)) return;placed.push(+b.dataset.i);draw();};
  $('#tray').onclick=e=>{const b=e.target.closest('.tile');if(!b||q.dataset.locked) return;placed.splice(placed.indexOf(+b.dataset.i),1);draw();};
  return ()=>{if(placed.length<k) return {empty:1,msg:'Col·loca tots els nombres en la safata.'};
    return {res:placed.every((i,p)=>nums[i]===sorted[p])?'ok':'bad',ans:sorted.join(up?' &lt; ':' &gt; ')};};
};
function expr(v){
  const k=['num','word','du','sum'][rnd(0,3)],t=Math.floor(v/10),u=v%10;
  if(k==='word') return nomHTML(v);
  if(k==='du') return `<span class="d">${t} D</span>${u?` + <span class="u">${u} U</span>`:''}`;
  if(k==='sum'&&v>10){const a=rnd(10,v-1);return `${a} + ${v-a}`;}
  return `${v}`;
}
G.cmp=q=>{
  const a=pickN();let b;
  if(Math.random()<.25) b=a;else{do{b=Math.random()<.6?a+rnd(-6,6):pickN();}while(b===a||b<R.min||b>R.max);}
  q.innerHTML=`<p class="ask">Compara amb &gt;, &lt; o =</p>
    <div class="cmp"><div class="expr">${expr(a)}</div><div class="slot" id="slot">?</div><div class="expr">${expr(b)}</div></div>
    <div class="signs">${['<','=','>'].map(s=>`<button class="blk sign" data-s="${s}" aria-pressed="false" aria-label="${s==='<'?'menor que':s==='>'?'major que':'igual'}">${s==='<'?'&lt;':s==='>'?'&gt;':'='}</button>`).join('')}</div>`;
  let pick=null;
  q.querySelectorAll('.sign').forEach(b2=>b2.onclick=()=>{if(q.dataset.locked) return;pick=b2.dataset.s;$('#slot').textContent=pick;q.querySelectorAll('.sign').forEach(o=>o.setAttribute('aria-pressed',o===b2));});
  const right=a<b?'<':a>b?'>':'=';
  return ()=>{if(!pick) return {empty:1,msg:'Tria un signe: >, < o =.'};
    return {res:pick===right?'ok':'bad',ans:`${a} ${right==='<'?'&lt;':right==='>'?'&gt;':'='} ${b}`};};
};
G.sum=q=>{
  let v,a,b;
  do{v=pickN(11,99);const tv=Math.floor(v/10),uv=v%10,ua=rnd(0,uv),ta=rnd(1,tv);a=ta*10+ua;b=(tv-ta)*10+(uv-ua);}while(b<=0);
  if(Math.random()<.5) [a,b]=[b,a];
  q.innerHTML=`<p class="ask">Calcula</p><div class="row"><span>${a}</span><span>+</span><span>${b}</span><span>=</span>${numIn('a1','Resultat')}</div>
    <p class="ask" style="font-size:.95rem">Pista: suma primer les <span class="d">desenes</span> i després les <span class="u">unitats</span>.</p>`;
  return ()=>{const x=val('a1');if(!x) return {empty:1};return {res:+x===v?'ok':'bad',ans:`${a} + ${b} = <b>${v}</b>`,n:v};};
};
const MIXABLE=['lx','tria','xl','ap','dec','ord','cmp','sum'];

/* ---------- partida ---------- */
const PRAISE=['Molt bé!','Perfecte!','Fantàstic!','Ben fet!','Genial!','Així es fa!','Bravo!'];
let S=null;
function start(mode){
  clearInterval(heroTimer);
  const m=MODES.find(x=>x.id===mode);
  S={mode,m,i:0,right:0,streak:0,check:null,answered:false,marks:[]};
  $('#streak').textContent=0;$('#streakPill').hidden=false;
  $('#view').innerHTML=`
  <div class="playhead"><button class="blk back" id="back">Tornar</button><h2>${m.t}</h2>
    <div class="prog" id="prog" aria-hidden="true">${'<i></i>'.repeat(ROUND)}</div></div>
  <div class="q" id="q" aria-live="polite"></div>
  <div class="fb" id="fb" role="status" hidden></div>
  <div class="actions"><button class="blk go" id="go">Comprova</button></div>`;
  $('#back').onclick=home;$('#go').onclick=step;
  next();
}
function paintProg(){$('#prog').querySelectorAll('i').forEach((el,k)=>{el.className=S.marks[k]||(k===S.i?'now':'');});}
function next(){
  const q=$('#q');delete q.dataset.locked;q.classList.remove('win','shake');
  const gen=S.mode==='mix'?MIXABLE[rnd(0,MIXABLE.length-1)]:S.mode;
  S.check=G[gen](q);S.answered=false;
  $('#fb').hidden=true;$('#go').textContent='Comprova';
  paintProg();
  const f=q.querySelector('input');if(f) f.focus({preventScroll:true});
}
function step(){
  if(S.answered){S.i++;return S.i>=ROUND?finish():next();}
  const r=S.check(),fb=$('#fb'),q=$('#q');
  if(r.empty){
    q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake');
    fb.className='fb hint';fb.hidden=false;fb.innerHTML=`<span>${r.msg||'Escriu la resposta abans de comprovar.'}</span>`;return;
  }
  S.answered=true;q.dataset.locked='1';
  q.querySelectorAll('input').forEach(i=>i.disabled=true);
  const ok=r.res!=='bad';
  if(ok){S.right++;S.streak++;confetti(S.streak>=3?110:60);q.classList.add('win');}
  else{S.streak=0;q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake');}
  $('#streak').textContent=S.streak;
  S.marks[S.i]=ok?'ok':'bad';paintProg();
  const bt=r.n&&r.n<=100?blocks(r.n,'anim'):'';
  fb.className='fb '+(ok?'ok':'bad');fb.hidden=false;
  fb.innerHTML=ok
    ?`<strong>${S.streak>=3?`${S.streak} seguides!`:PRAISE[rnd(0,PRAISE.length-1)]}</strong><span>${r.ans}</span>${r.tip?`<span>${r.tip}</span>`:''}${bt}`
    :`<strong>Quasi! Mira la resposta:</strong><span>${r.ans}</span>${r.tip?`<span>${r.tip}</span>`:''}${bt}`;
  $('#go').textContent=S.i+1>=ROUND?'Vore el resultat':'Següent';
  $('#go').focus({preventScroll:true});
}
function finish(){
  const n=S.right,st=n===ROUND?3:n>=7?2:n>=4?1:0;
  if(st>store.get(bestKey(S.mode),0)) store.set(bestKey(S.mode),st);
  store.set('total',store.get('total',0)+st);updateTotal();$('#streakPill').hidden=true;
  const msg=st===3?'Ho has encertat tot!':st===2?'Molt bona feina!':st===1?'Vas bé, continua practicant.':'Torna-ho a provar, segur que ara t’ix millor.';
  $('#view').innerHTML=`
  <div class="q done">
    <div class="bigstars">${stars(st)}</div>
    <h2>${msg}</h2>
    <p class="ask">Has encertat ${n} de ${ROUND} en «${S.m.t}», nombres del ${R.min} al ${R.max}.</p>
    <div class="doneacts"><button class="blk go" id="again">Una altra volta</button><button class="blk ghost" id="menu">Altres jocs</button></div>
  </div>`;
  if(st>=2){confetti(160);setTimeout(()=>confetti(120),450);}
  $('#again').onclick=()=>start(S.mode);$('#menu').onclick=home;
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#go')&&!e.target.closest('button')){e.preventDefault();$('#go').click();}});
$('#homeBtn').onclick=home;
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}
updateTotal();home();
})();
</script>
