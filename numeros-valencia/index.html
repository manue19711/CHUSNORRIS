<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Comptem en valencià</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: school notebook (squared paper). Single column; the worksheet's colours code meaning: blue = desenes (D), red = unitats (U). */
:root{
  --paper:#f8fbff; --grid:#dfe9f5; --card:#ffffff; --line:#c8d6e6;
  --ink:#1b2838; --muted:#596b81;
  --d:#1188c9; --u:#e02c58; --teal:#0d8a85; --star:#f2b300;
  --ok:#1b8f4e; --ok-bg:#e3f6ea; --bad:#c9304b; --bad-bg:#fde8ec; --hint-bg:#fff6d8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111923; --grid:#1a2633; --card:#172230; --line:#2b3a4d;
  --ink:#e8eef6; --muted:#9db0c6;
  --d:#55b9ee; --u:#ff6b8b; --teal:#3cc4bd; --star:#ffc933;
  --ok:#55d08d; --ok-bg:#163526; --bad:#ff7a90; --bad-bg:#3b1a22; --hint-bg:#3a3215;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111923; --grid:#1a2633; --card:#172230; --line:#2b3a4d;
  --ink:#e8eef6; --muted:#9db0c6;
  --d:#55b9ee; --u:#ff6b8b; --teal:#3cc4bd; --star:#ffc933;
  --ok:#55d08d; --ok-bg:#163526; --bad:#ff7a90; --bad-bg:#3b1a22; --hint-bg:#3a3215;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--d);outline-offset:2px}
.app{max-width:860px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--display);font-weight:800;font-size:1.25rem}
.brand .sq{display:grid;place-items:center;width:38px;height:38px;border-radius:6px;background:var(--d);color:#fff;font-size:1.05rem}
.stars{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 10px}
.stars svg{width:20px;height:20px;fill:var(--star)}

h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
h1 .d{color:var(--d)} h1 .u{color:var(--u)}
.lead{margin:.4rem 0 0;color:var(--muted);max-width:60ch}

.label{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.ranges{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--c)}
.mode .num{grid-row:span 3;display:grid;place-items:center;width:34px;height:34px;border-radius:5px;background:var(--c);color:#fff;font-family:var(--display);font-weight:800}
.mode h3{font-size:1.15rem;color:var(--c)}
.mode p{margin:0;font-size:.92rem;color:var(--muted)}
.mode .best{display:flex;gap:2px;margin-top:4px}
.best svg{width:16px;height:16px;fill:var(--line)} .best svg.on{fill:var(--star)}

/* play */
.playhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;font-weight:800}
.playhead h2{font-size:1.4rem;flex:1;min-width:0;color:var(--c)}
.prog{display:flex;align-items:center;gap:10px;width:100%}
.bar{flex:1;height:12px;border-radius:99px;background:var(--grid);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.count{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}

.q{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;min-height:240px;justify-content:center}
.q.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ask{margin:0;font-weight:800;color:var(--muted)}
.word{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.2rem);line-height:1.1;word-break:break-word}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(3.5rem,14vw,5.5rem);line-height:1;font-variant-numeric:tabular-nums}
.d{color:var(--d)} .u{color:var(--u)} .t{color:var(--teal)}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem)}
input.num,input.txt{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6vw,2.1rem);text-align:center;color:var(--ink);background:var(--paper);border:0;border-bottom:3px solid var(--ink);border-radius:6px 6px 0 0;padding:2px 6px;width:3.2ch;min-width:2.4em}
input.txt{width:100%;max-width:420px;font-size:clamp(1.3rem,5vw,1.8rem)}
input.dd{border-bottom-color:var(--d)} input.uu{border-bottom-color:var(--u)}
.unit{font-size:.8em}
.speak{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem}
.speak svg{width:18px;height:18px;fill:currentColor}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;width:100%;max-width:560px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;font-family:var(--display);font-weight:700;font-size:1.3rem}
.opt[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.expr{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,5vw,1.8rem);background:var(--paper);border:2px dashed var(--line);border-radius:10px;padding:12px 8px;min-width:0;word-break:break-word}
.slot{display:grid;place-items:center;width:58px;height:58px;border-radius:10px;border:3px dashed var(--line);font-family:var(--display);font-weight:800;font-size:2rem}
.signs{display:flex;gap:10px}
.sign{width:64px;height:56px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:800;font-size:1.8rem}
.sign[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}

.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:62px}
.tile{width:62px;height:58px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile.used{visibility:hidden}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:66px;width:100%;padding:6px;border-radius:10px;border:2px dashed var(--line)}
.tray .tile{background:var(--c);border-color:var(--c);color:#fff}
.tray:empty::before{content:"Toca els nombres en ordre";color:var(--muted);font-weight:700;align-self:center}
.dir{font-family:var(--display);font-weight:800;font-size:1.25rem}

.fb{border-radius:10px;padding:14px 16px;border:2px solid;display:flex;flex-direction:column;gap:4px}
.fb strong{font-family:var(--display);font-size:1.3rem}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)} .fb.ok strong{color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)} .fb.bad strong{color:var(--bad)}
.fb.hint{background:var(--hint-bg);border-color:var(--star);color:var(--ink)}
.actions{display:flex;justify-content:flex-end}
.go{border:0;border-radius:12px;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:1.3rem;padding:10px 28px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 60%,#000)}

/* learn */
.grid100{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;width:100%}
.cell{aspect-ratio:1;max-width:100%;border:2px solid var(--line);background:var(--paper);border-radius:6px;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(.8rem,2.6vw,1.05rem);padding:0}
.cell[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.detail{display:flex;flex-direction:column;align-items:center;gap:8px}
.du{color:var(--muted);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:.9rem}

.done{text-align:center;align-items:center}
.bigstars{display:flex;gap:8px;justify-content:center}
.bigstars svg{width:56px;height:56px;fill:var(--line)} .bigstars svg.on{fill:var(--star);animation:pop .4s backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.2)}}
.doneacts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{border:2px solid var(--line);background:var(--card);border-radius:12px;font-family:var(--display);font-weight:800;font-size:1.15rem;padding:8px 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.cmp{grid-template-columns:1fr}.cmp .slot{justify-self:center}}
</style>

<div class="app">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Inici"><span class="sq">10</span>Comptem en valencià</button>
    <div class="stars" title="Estrelles guanyades"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg><span id="totalStars">0</span></div>
  </header>
  <main id="view"></main>
</div>

<script>
(() => {
/* ---------- Nombres en valencià ---------- */
const UNI=['zero','un','dos','tres','quatre','cinc','sis','set','huit','nou'];
const TEEN=['deu','onze','dotze','tretze','catorze','quinze','setze','dèsset','devuit','dènou'];
const TENS={2:'vint',3:'trenta',4:'quaranta',5:'cinquanta',6:'seixanta',7:'setanta',8:'huitanta',9:'noranta'};
function parts(n){ // [desena, unió, unitat] per a pintar colors
  if(n===100) return {whole:'cent'};
  if(n<10) return {whole:n===1?'u':UNI[n]};
  if(n<20) return {whole:TEEN[n-10]};
  const t=Math.floor(n/10),u=n%10;
  if(!u) return {d:TENS[t],j:'',u:''};
  return {d:TENS[t],j:t===2?'-i-':'-',u:UNI[u]};
}
function nom(n){const p=parts(n);return p.whole??(p.d+p.j+p.u);}
function nomHTML(n){const p=parts(n);if(p.whole) return `<span class="t">${p.whole}</span>`;return `<span class="d">${p.d}</span>${p.j}${p.u?`<span class="u">${p.u}</span>`:''}`;}
// formes acceptades
const ALT_U={1:['un','u'],8:['huit','vuit']};
const ALT_TEEN={17:['dèsset','disset','desset','dèset'],18:['devuit','divuit','dihuit','díhuit'],19:['dènou','dinou','denou']};
const ALT_T={8:['huitanta','vuitanta']};
function variants(n){
  if(n===100) return ['cent'];
  if(n<20 && n>=10) return ALT_TEEN[n]||[TEEN[n-10]];
  const t=Math.floor(n/10),u=n%10, ts=ALT_T[t]||[TENS[t]];
  if(!u) return ts;
  const us=ALT_U[u]||[UNI[u]], out=[];
  ts.forEach(a=>us.forEach(b=>out.push(a+(t===2?'-i-':'-')+b)));
  return out;
}
const clean=s=>s.toLowerCase().trim().replace(/[’']/g,'').replace(/[\s-]+/g,'-');
const bare=s=>clean(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/-/g,'');
function checkName(input,n){
  const v=variants(n), c=clean(input);
  if(v.includes(c)) return 'ok';
  if(v.some(x=>bare(x)===bare(c))) return 'near';
  return 'bad';
}

/* ---------- utilitats ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>';
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const store={get(k,d){try{const v=localStorage.getItem('cv_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('cv_'+k,JSON.stringify(v));}catch(e){}}};
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text); u.lang='ca-ES'; u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/^ca/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
const speakBtn=n=>`<button type="button" class="speak" data-say="${nom(n)}">${SPK} Escolta</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b) speak(b.dataset.say);});

/* ---------- configuració ---------- */
const RANGES=[
  {id:'10-19',min:10,max:19},{id:'20-29',min:20,max:29},{id:'10-29',min:10,max:29},
  {id:'30-59',min:30,max:59},{id:'60-100',min:60,max:100},{id:'10-100',min:10,max:100}];
const MODES=[
  {id:'learn',t:'Aprén els nombres',p:'Toca un nombre per a vore com s’escriu i escoltar-lo.',c:'var(--teal)'},
  {id:'lx',t:'De lletres a xifres',p:'Llig el nombre escrit amb lletres i escriu la xifra.',c:'#2a3646'},
  {id:'tria',t:'Tria el nom',p:'Quin és el nom correcte del nombre? Tria’l.',c:'var(--d)'},
  {id:'xl',t:'Escriu amb lletres',p:'Escriu el nom de cada nombre en valencià.',c:'var(--teal)'},
  {id:'ap',t:'Anterior i posterior',p:'Escriu el nombre d’abans i el de després.',c:'var(--u)'},
  {id:'dec',t:'Descomposició',p:'Descompon el nombre en desenes (D) i unitats (U).',c:'var(--u)'},
  {id:'ord',t:'Ordena els nombres',p:'De menor a major o de major a menor.',c:'var(--teal)'},
  {id:'cmp',t:'Compara: >, < o =',p:'Quin és major? Amb xifres, lletres, D i U.',c:'#7a4fc9'},
  {id:'sum',t:'Sumes',p:'Suma desenes i unitats: 20 + 7, 15 + 10…',c:'#c46a00'},
  {id:'mix',t:'Repàs de tot',p:'Una mica de cada exercici, barrejat.',c:'var(--ink)'}];
const ROUND=10;
let R=RANGES.find(r=>r.id===store.get('range','10-100'))||RANGES[5];
const pickN=(lo=R.min,hi=R.max)=>rnd(Math.max(lo,R.min),Math.min(hi,R.max));
const bestKey=m=>`best_${m}_${R.id}`;
const updateTotal=()=>{$('#totalStars').textContent=store.get('total',0);};

/* ---------- inici ---------- */
function home(){
  document.documentElement.style.removeProperty('--c');
  $('#view').innerHTML=`
  <section>
    <h1>Els nombres del <span class="d">10</span> al <span class="u">100</span></h1>
    <p class="lead">Practica com a la fitxa de classe: llig, escriu, ordena, descompon i compara nombres en valencià.</p>
  </section>
  <section>
    <p class="label">Amb quins nombres vols jugar?</p>
    <div class="ranges">${RANGES.map(r=>`<button class="chip" data-range="${r.id}" aria-pressed="${r.id===R.id}">${r.id.replace('-',' – ')}</button>`).join('')}</div>
  </section>
  <section>
    <p class="label">Tria un exercici</p>
    <div class="modes">${MODES.map((m,i)=>{
      const b=store.get(bestKey(m.id),0);
      return `<button class="mode" data-mode="${m.id}" style="--c:${m.c}">
        <span class="num">${i===0?'A':i}</span><h3>${m.t}</h3><p>${m.p}</p>
        ${m.id==='learn'?'':`<span class="best" aria-label="Millor resultat: ${b} de 3 estrelles">${[1,2,3].map(k=>STAR.replace('<svg',`<svg class="${k<=b?'on':''}"`)).join('')}</span>`}
      </button>`;}).join('')}</div>
  </section>`;
  $('#view').querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{R=RANGES.find(r=>r.id===b.dataset.range);store.set('range',R.id);home();});
  $('#view').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>b.dataset.mode==='learn'?learn():start(b.dataset.mode));
}

/* ---------- aprén ---------- */
function learn(){
  const m=MODES[0]; document.documentElement.style.setProperty('--c',m.c);
  $('#view').innerHTML=`
  <div class="playhead"><button class="back" id="back">← Tornar</button><h2>${m.t} (${R.id.replace('-',' – ')})</h2></div>
  <div class="q"><div class="detail" id="det"></div>
    <div class="legend"><span class="d">■ desenes</span><span class="u">■ unitats</span><span class="t">■ nom especial</span></div>
    <div class="grid100" id="g"></div></div>`;
  $('#back').onclick=home;
  const g=$('#g');
  for(let n=R.min;n<=R.max;n++) g.insertAdjacentHTML('beforeend',`<button class="cell" data-n="${n}" aria-pressed="false">${n}</button>`);
  const show=n=>{
    g.querySelectorAll('.cell').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.n===n));
    const t=Math.floor(n/10),u=n%10;
    $('#det').innerHTML=`<div class="bignum"><span class="d">${n===100?'10':t}</span><span class="u">${n===100?'0':u}</span></div>
      <div class="word">${nomHTML(n)}</div>
      <div class="du">${n===100?'10 desenes = 1 centena':`${t} ${t===1?'desena':'desenes'} i ${u} ${u===1?'unitat':'unitats'} = ${t*10} + ${u}`}</div>${speakBtn(n)}`;
  };
  g.onclick=e=>{const c=e.target.closest('.cell');if(c){show(+c.dataset.n);speak(nom(+c.dataset.n));}};
  show(R.min);
}

/* ---------- generadors de preguntes ---------- */
// Cada generador pinta la pregunta a #q i torna check() -> {empty} | {res:'ok'|'near'|'bad', ans, tip}
const val=id=>($('#'+id)?.value||'').trim();
const G={};
G.lx=q=>{
  const n=pickN();
  q.innerHTML=`<p class="ask">Escriu la xifra</p><div class="word">${nom(n)}</div>${speakBtn(n)}
    <input id="a1" class="num" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Xifra">`;
  return ()=>{const v=val('a1');if(!v) return {empty:1};return {res:+v===n?'ok':'bad',ans:`${nomHTML(n)} → <b>${n}</b>`};};
};
G.tria=q=>{
  const n=pickN();
  const cand=[n-1,n+1,n-10,n+10,n+2,n-2,(n%10)*10+Math.floor(n/10),n+11,n-11].filter(x=>x>=10&&x<=100&&x!==n);
  const opts=shuffle([n,...shuffle([...new Set(cand)]).slice(0,3)]);
  q.innerHTML=`<p class="ask">Quin és el nom d’aquest nombre?</p><div class="bignum">${n}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}" aria-pressed="false">${nom(o)}</button>`).join('')}</div>`;
  let pick=null;
  q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(q.dataset.locked) return;pick=+b.dataset.v;q.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));});
  return ()=>{
    if(pick===null) return {empty:1,msg:'Toca una de les respostes.'};
    q.querySelectorAll('.opt').forEach(o=>{o.setAttribute('aria-pressed','false');if(+o.dataset.v===n)o.classList.add('right');else if(+o.dataset.v===pick)o.classList.add('wrong');});
    return {res:pick===n?'ok':'bad',ans:`<b>${n}</b> → ${nomHTML(n)}`};
  };
};
G.xl=q=>{
  const n=pickN();
  q.innerHTML=`<p class="ask">Escriu el nom en valencià</p><div class="bignum">${n}</div>
    <input id="a1" class="txt" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Nom del nombre">`;
  return ()=>{
    const v=val('a1'); if(!v) return {empty:1};
    const r=checkName(v,n);
    return {res:r,ans:`<b>${n}</b> → ${nomHTML(n)}`,tip:r==='near'?`Fixa’t en els accents i els guionets: s’escriu <b>${nom(n)}</b>.`:''};
  };
};
G.ap=q=>{
  const n=pickN(1,99);
  q.innerHTML=`<p class="ask">Escriu el nombre anterior i el posterior</p>
    <div class="row"><input id="a1" class="num" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Anterior">
    <span>&lt;</span><span class="bignum" style="font-size:1.4em">${n}</span><span>&lt;</span>
    <input id="a2" class="num" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Posterior"></div>`;
  return ()=>{const a=val('a1'),b=val('a2');if(!a||!b) return {empty:1};
    return {res:(+a===n-1&&+b===n+1)?'ok':'bad',ans:`<b>${n-1}</b> &lt; ${n} &lt; <b>${n+1}</b>`};};
};
G.dec=q=>{
  const n=pickN(10,99),t=Math.floor(n/10),u=n%10;
  const inp=(id,c,l)=>`<input id="${id}" class="num ${c}" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="${l}">`;
  q.innerHTML=`<p class="ask">Descompon en desenes (D) i unitats (U)</p>
    <div class="row"><span class="bignum" style="font-size:1.4em">${n}</span><span>=</span>${inp('a1','dd','Desenes')}<span class="unit d">D</span><span>+</span>${inp('a2','uu','Unitats')}<span class="unit u">U</span></div>
    <div class="row"><span>=</span>${inp('a3','dd','Valor de les desenes')}<span>+</span>${inp('a4','uu','Valor de les unitats')}</div>`;
  return ()=>{
    const a=[val('a1'),val('a2'),val('a3'),val('a4')]; if(a.some(x=>!x)) return {empty:1};
    const ok1=+a[0]===t&&+a[1]===u, ok2=+a[2]===t*10&&+a[3]===u;
    let tip='';
    if(ok1&&!ok2&&+a[2]===t) tip=`Recorda: ${t} ${t===1?'desena val':'desenes valen'} <b>${t*10}</b>, no ${t}.`;
    return {res:ok1&&ok2?'ok':'bad',ans:`${n} = <span class="d">${t} D</span> + <span class="u">${u} U</span> = <span class="d">${t*10}</span> + <span class="u">${u}</span>`,tip};
  };
};
G.ord=q=>{
  const size=R.max-R.min+1,k=Math.min(6,size),set=new Set();
  while(set.size<k) set.add(rnd(R.min,R.max));
  const nums=shuffle([...set]),up=Math.random()<.5,placed=[];
  const sorted=[...nums].sort((a,b)=>up?a-b:b-a);
  q.innerHTML=`<p class="ask">Ordena de</p><div class="dir">${up?'menor a major ↗':'major a menor ↘'}</div>
    <div class="tiles" id="src">${nums.map((n,i)=>`<button class="tile" data-i="${i}">${n}</button>`).join('')}</div>
    <div class="tray" id="tray" aria-label="La teua ordenació"></div><p class="ask" style="font-size:.85rem">Toca un nombre de baix per a llevar-lo.</p>`;
  const draw=()=>{
    q.querySelectorAll('#src .tile').forEach(b=>b.classList.toggle('used',placed.includes(+b.dataset.i)));
    $('#tray').innerHTML=placed.map(i=>`<button class="tile" data-i="${i}">${nums[i]}</button>`).join('');
  };
  $('#src').onclick=e=>{const b=e.target.closest('.tile');if(!b||q.dataset.locked||placed.includes(+b.dataset.i)) return;placed.push(+b.dataset.i);draw();};
  $('#tray').onclick=e=>{const b=e.target.closest('.tile');if(!b||q.dataset.locked) return;placed.splice(placed.indexOf(+b.dataset.i),1);draw();};
  return ()=>{
    if(placed.length<k) return {empty:1,msg:'Col·loca tots els nombres.'};
    const ok=placed.every((i,p)=>nums[i]===sorted[p]);
    return {res:ok?'ok':'bad',ans:sorted.join(up?' &lt; ':' &gt; ')};
  };
};
function expr(v,kinds){
  const k=kinds[rnd(0,kinds.length-1)];
  const t=Math.floor(v/10),u=v%10;
  if(k==='word') return nomHTML(v);
  if(k==='du') return `<span class="d">${t} D</span>${u?` + <span class="u">${u} U</span>`:''}`;
  if(k==='sum'&&v>10){const a=rnd(10,v-1);return `${a} + ${v-a}`;}
  return `${v}`;
}
G.cmp=q=>{
  const a=pickN(); let b;
  if(Math.random()<.25) b=a; else { do{ b=Math.random()<.6?a+rnd(-6,6):pickN(); }while(b===a||b<R.min||b>R.max); }
  const kinds=['num','word','du','sum'];
  q.innerHTML=`<p class="ask">Compara amb &gt;, &lt; o =</p>
    <div class="cmp"><div class="expr">${expr(a,kinds)}</div><div class="slot" id="slot">?</div><div class="expr">${expr(b,kinds)}</div></div>
    <div class="signs">${['<','=','>'].map(s=>`<button class="sign" data-s="${s}" aria-pressed="false" aria-label="${s==='<'?'menor que':s==='>'?'major que':'igual'}">${s.replace('<','&lt;').replace('>','&gt;')}</button>`).join('')}</div>`;
  let pick=null;
  q.querySelectorAll('.sign').forEach(b2=>b2.onclick=()=>{if(q.dataset.locked) return;pick=b2.dataset.s;$('#slot').textContent=pick;q.querySelectorAll('.sign').forEach(o=>o.setAttribute('aria-pressed',o===b2));});
  const right=a<b?'<':a>b?'>':'=';
  return ()=>{if(!pick) return {empty:1,msg:'Tria un signe: >, < o =.'};
    return {res:pick===right?'ok':'bad',ans:`${a} ${right.replace('<','&lt;').replace('>','&gt;')} ${b}`};};
};
G.sum=q=>{
  let v,a,b;
  do{ v=pickN(11,99); const tv=Math.floor(v/10),uv=v%10;
      const ua=rnd(0,uv),ta=rnd(1,tv); a=ta*10+ua; b=(tv-ta)*10+(uv-ua); }while(b<=0);
  if(Math.random()<.5) [a,b]=[b,a];
  q.innerHTML=`<p class="ask">Calcula</p><div class="row"><span>${a}</span><span>+</span><span>${b}</span><span>=</span>
    <input id="a1" class="num" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Resultat"></div>
    <p class="ask" style="font-size:.9rem">Pista: suma primer les <span class="d">desenes</span> i després les <span class="u">unitats</span>.</p>`;
  return ()=>{const x=val('a1');if(!x) return {empty:1};return {res:+x===v?'ok':'bad',ans:`${a} + ${b} = <b>${v}</b> (${nomHTML(v)})`};};
};
const MIXABLE=['lx','tria','xl','ap','dec','ord','cmp','sum'];

/* ---------- partida ---------- */
const PRAISE=['Molt bé!','Perfecte!','Fantàstic!','Ben fet!','Genial!','Així es fa!'];
let S=null;
function start(mode){
  const m=MODES.find(x=>x.id===mode);
  document.documentElement.style.setProperty('--c',m.c);
  S={mode,m,i:0,right:0,check:null,answered:false};
  $('#view').innerHTML=`
  <div class="playhead"><button class="back" id="back">← Tornar</button><h2>${m.t}</h2>
    <div class="prog"><div class="bar"><i id="bar" style="width:0"></i></div><span class="count" id="cnt"></span></div></div>
  <div class="q" id="q"></div>
  <div class="fb" id="fb" hidden></div>
  <div class="actions"><button class="go" id="go">Comprova</button></div>`;
  $('#back').onclick=home;
  $('#go').onclick=step;
  next();
}
function next(){
  const q=$('#q'); delete q.dataset.locked;
  const gen=S.mode==='mix'?MIXABLE[rnd(0,MIXABLE.length-1)]:S.mode;
  S.check=G[gen](q); S.answered=false;
  $('#fb').hidden=true; $('#go').textContent='Comprova';
  $('#cnt').textContent=`${S.i+1}/${ROUND}`;
  $('#bar').style.width=`${S.i/ROUND*100}%`;
  const f=q.querySelector('input'); if(f) f.focus({preventScroll:true});
}
function step(){
  if(S.answered){ S.i++; return S.i>=ROUND?finish():next(); }
  const r=S.check(), fb=$('#fb'), q=$('#q');
  if(r.empty){
    q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake');
    fb.className='fb hint'; fb.hidden=false; fb.innerHTML=`<span>${r.msg||'Escriu la resposta abans de comprovar.'}</span>`; return;
  }
  S.answered=true; q.dataset.locked='1';
  q.querySelectorAll('input').forEach(i=>i.disabled=true);
  const ok=r.res!=='bad'; if(ok) S.right++;
  fb.className='fb '+(ok?'ok':'bad'); fb.hidden=false;
  fb.innerHTML=ok
    ? `<strong>${PRAISE[rnd(0,PRAISE.length-1)]}</strong>${r.tip?`<span>${r.tip}</span>`:''}<span>${r.ans}</span>`
    : `<strong>Quasi! Mira la resposta:</strong><span>${r.ans}</span>${r.tip?`<span>${r.tip}</span>`:''}`;
  $('#bar').style.width=`${(S.i+1)/ROUND*100}%`;
  $('#go').textContent=S.i+1>=ROUND?'Vore el resultat':'Següent';
  $('#go').focus({preventScroll:true});
}
function finish(){
  const n=S.right, stars=n===ROUND?3:n>=7?2:n>=4?1:0;
  const prev=store.get(bestKey(S.mode),0);
  if(stars>prev) store.set(bestKey(S.mode),stars);
  store.set('total',store.get('total',0)+stars); updateTotal();
  const msg=stars===3?'Ho has encertat tot!':stars===2?'Molt bona feina!':stars===1?'Vas bé, continua practicant.':'Torna-ho a provar, segur que ara t’ix millor.';
  $('#view').innerHTML=`
  <div class="q done">
    <div class="bigstars">${[1,2,3].map(k=>STAR.replace('<svg',`<svg class="${k<=stars?'on':''}"`)).join('')}</div>
    <h2 style="font-size:2rem">${msg}</h2>
    <p class="ask" style="font-size:1.2rem">${n} de ${ROUND} respostes correctes · ${S.m.t} · ${R.id.replace('-',' – ')}</p>
    <div class="doneacts"><button class="go" id="again">Una altra volta</button><button class="ghost" id="menu">Altres exercicis</button></div>
  </div>`;
  $('#again').onclick=()=>start(S.mode); $('#menu').onclick=home;
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#go')&&!e.target.closest('button')){e.preventDefault();$('#go').click();}});
$('#homeBtn').onclick=home;
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}
updateTotal(); home();
})();
</script>
