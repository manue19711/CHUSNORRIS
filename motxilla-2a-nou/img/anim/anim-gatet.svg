<ellipse cx="100" cy="150" rx="30" ry="18" fill="#ffd1a0"/><ellipse cx="80" cy="106" rx="13" ry="15" fill="#fff"/><circle cx="83" cy="108" r="7" fill="#1b2559" class="blink"/><circle cx="86" cy="104" r="2.5" fill="#fff"/><ellipse cx="120" cy="106" rx="13" ry="15" fill="#fff"/><circle cx="123" cy="108" r="7" fill="#1b2559" class="blink"/><circle cx="126" cy="104" r="2.5" fill="#fff"/><path d="M96 124 L100 130 L104 124Z" fill="#ff5a4e"/><path d="M100 130 Q94 138 88 134 M100 130 Q106 138 112 134" stroke="#1b2559" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60 118h-22M60 126l-22 6M140 118h22M140 126l22 6" stroke="#1b2559" stroke-width="2.5" stroke-linecap="round"/></g></svg>