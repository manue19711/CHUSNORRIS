<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><style>
.bob{animation:bob 2s ease-in-out infinite}
.hop{animation:hop 1.4s ease-in-out infinite}
.blink{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .35s ease-in-out infinite alternate}
.tongue{transform-origin:100px 130px;animation:tongue 2.4s ease-in-out infinite}
.tail{transform-origin:150px 150px;animation:tail 1.1s ease-in-out infinite}
.fin{transform-origin:60px 100px;animation:fin 1s ease-in-out infinite alternate}
.bub{animation:bub 2.2s linear infinite}
.bub.d{animation-delay:1.1s}
.flame{transform-box:fill-box;transform-origin:center top;animation:flame .2s ease-in-out infinite alternate}
.head{transform-origin:100px 110px;animation:head 3s ease-in-out infinite}
.shake{animation:shake .5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-22px) scale(1.04,.96)}35%{transform:translateY(0) scale(1.06,.94)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flap{to{transform:scaleY(.25)}}
@keyframes tongue{0%,70%,100%{transform:scaleY(0)}80%,90%{transform:scaleY(1)}}
@keyframes tail{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
@keyframes fin{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
@keyframes flame{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
@keyframes head{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-1deg)}75%{transform:translateX(2px) rotate(1deg)}}
</style><rect width="200" height="200" rx="100" fill="#dfe9ff"/><g class="shake"><path d="M100 24 Q132 60 132 120 L68 120 Q68 60 100 24Z" fill="#fff" stroke="#1b2559" stroke-width="3"/>
<circle cx="100" cy="82" r="18" fill="#1c73d9" stroke="#1b2559" stroke-width="3"/><path d="M68 110 L44 140 L68 136Z M132 110 L156 140 L132 136Z" fill="#ff5a4e"/>
<path d="M86 120 Q100 180 114 120Z" fill="#ffb81f" class="flame"/><path d="M94 120 Q100 160 106 120Z" fill="#ff5a4e" class="flame"/></g></svg>