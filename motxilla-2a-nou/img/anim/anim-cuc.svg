<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
.bob{animation:bob 2.4s ease-in-out infinite}
.blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
.blink.r{animation-delay:.08s}
.wave{transform-origin:142px 140px;animation:wave 2s ease-in-out infinite}
.wave2{transform-origin:58px 140px;animation:wave 2s ease-in-out infinite reverse}
.spin{transform-origin:100px 100px;animation:spin 8s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.d2{animation-delay:.8s}
.wag{transform-origin:140px 110px;animation:wag 1.2s ease-in-out infinite}
.breathe{transform-origin:center;transform-box:fill-box;animation:breathe 2.2s ease-in-out infinite}
.drop{animation:drop 1.1s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}
@keyframes wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes drop{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}
</style>
<rect width="200" height="200" rx="100" fill="#e7f7c2"/>
<g class="bob">
<path d="M86 52 Q80 26 70 18" stroke="#1b2559" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="70" cy="16" r="8" fill="#ffb81f" class="pulse"/><path d="M114 52 Q120 26 130 18" stroke="#1b2559" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="130" cy="16" r="8" fill="#ffb81f" class="pulse d2"/>
<path d="M58 140 Q36 120 44 96" stroke="#168a4a" stroke-width="12" fill="none" stroke-linecap="round" class="wave"/><path d="M142 140 Q164 120 156 96" stroke="#168a4a" stroke-width="12" fill="none" stroke-linecap="round" class="wave2"/>
<ellipse cx="100" cy="150" rx="46" ry="12" fill="#1b2559" opacity=".12"/>
<circle cx="100" cy="112" r="56" fill="#168a4a"/>
<ellipse cx="100" cy="112" rx="56" ry="50" fill="#168a4a"/>
<ellipse cx="78" cy="100" rx="14" ry="16" fill="#fff"/><ellipse cx="122" cy="100" rx="14" ry="16" fill="#fff"/>
<circle cx="82" cy="104" r="7" fill="#1b2559" class="blink"/><circle cx="118" cy="104" r="7" fill="#1b2559" class="blink r"/>
<circle cx="86" cy="100" r="2.5" fill="#fff"/><circle cx="122" cy="100" r="2.5" fill="#fff"/>
<circle cx="64" cy="126" r="8" fill="#ff8fb3" opacity=".7"/><circle cx="136" cy="126" r="8" fill="#ff8fb3" opacity=".7"/>
<path d="M88 130 Q100 142 112 130" stroke="#1b2559" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>
</svg>